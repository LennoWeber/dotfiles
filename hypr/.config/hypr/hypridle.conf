# IPC an die aktive Shell; ohne antwortende Shell sperrt hyprlock
$lock_cmd = /home/lenno/.local/bin/shell-switch msg session lock

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = $lock_cmd
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5min
    on-timeout = $lock_cmd
}

listener {
    timeout = 600 # 10min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
