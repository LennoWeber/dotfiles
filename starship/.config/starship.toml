"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
[](color_primary)\
$os\
$username\
[](bg:color_secondary fg:color_primary)\
$directory\
[](fg:color_secondary bg:color_tertiary)\
$git_branch\
$git_status\
[](fg:color_tertiary bg:color_surface)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:color_surface bg:color_muted)\
$docker_context\
[](fg:color_muted bg:color_deep)\
$time\
[ ](fg:color_deep)\
"""

[username]
show_always = true
style_user = "bg:color_primary fg:color_on_primary bold"
style_root = "bg:color_primary fg:color_error bold"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:color_primary fg:color_on_primary"
disabled = true

[directory]
style = "bg:color_secondary fg:color_on_secondary"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:color_muted fg:color_on_muted"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:color_tertiary fg:color_on_tertiary bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:color_tertiary fg:color_on_tertiary"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:color_surface fg:color_on_surface"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_deep fg:color_on_deep"
format = '[ ♥ $time ]($style)'

# >>> NOCTALIA STARSHIP PALETTE >>>
[palettes.noctalia]
# Dynamic Noctalia Material Theme Colors
color_primary       = "#f2a33c"
color_on_primary    = "#1d1d1f"
color_secondary     = "#ffc482"
color_on_secondary  = "#1d1d1f"
color_tertiary      = "#a3b18a"
color_on_tertiary   = "#1c2415"
color_error         = "#e5604c"

color_surface       = "#cf6d00"
color_on_surface    = "#2e1d07"
color_muted         = "#221e17"
color_on_muted      = "#a79c8a"
color_deep          = "#2e291f"
color_on_deep       = "#f4ede1"

# Fallbacks for standard names
blue      = "#f2a33c"
red       = "#e5604c"
green     = "#a3b18a"
yellow    = "#ffc482"
cyan      = "#ffc380"
magenta   = "#f7c787"
white     = "#f4ede1"
black     = "#16130e"
# <<< NOCTALIA STARSHIP PALETTE <<<
