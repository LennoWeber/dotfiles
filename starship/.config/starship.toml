"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
[](sapphire)\
$os\
$username\
[](bg:teal fg:sapphire)\
$directory\
[](fg:teal bg:mauve)\
$git_branch\
$git_status\
[](fg:mauve bg:surface2)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:surface2 bg:overlay1)\
$docker_context\
[](fg:overlay1 bg:surface0)\
$time\
[ ](fg:surface0)\
"""

[username]
show_always = true
style_user = "bg:sapphire fg:crust bold"
style_root = "bg:sapphire fg:maroon bold"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:sapphire fg:crust"
disabled = true

[directory]
style = "bg:teal fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:overlay1 fg:text"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:mauve fg:crust bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:mauve fg:crust"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:surface2 fg:text"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:surface0 fg:subtext1"
format = '[ ♥ $time ]($style)'

