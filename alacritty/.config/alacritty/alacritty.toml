[window]
padding = { x = 0, y = 0 }
dynamic_padding = false

[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]

[colors.primary]
background = "#fbf1c7"


[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
